name: Keep Alive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 120 https://fyugkuuesc6hsn3al72jtf.streamlit.app)
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "App returned $HTTP_CODE, may be sleeping or down"
            exit 1
          fi
          echo "App is alive"
