// D3 SETUP
const container = document.getElementById("graph-container");
const W = container.clientWidth || window.innerWidth - 300;
const H = container.clientHeight || window.innerHeight;

const svg = d3.select("#graph-container").append("svg")
  .attr("viewBox", [0, 0, W, H]);

const g = svg.append("g");

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 5])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
    updateLabelPositions(event.transform);
  });
svg.call(zoom);

let currentTransform = d3.zoomIdentity;

function updateLabelPositions(transform) {
  currentTransform = transform || d3.zoomIdentity;
  labels.style("left", function(d) {
    return (d.x * currentTransform.k + currentTransform.x) + "px";
  }).style("top", function(d) {
    return (d.y * currentTransform.k + currentTransform.y) + "px";
  }).style("transform", `translate(-50%, ${12 * currentTransform.k}px) scale(${Math.max(0.6, currentTransform.k)})`);
}

// Zoom buttons
d3.select("#zoom-in").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.4));
d3.select("#zoom-out").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 0.7));
d3.select("#zoom-reset").on("click", () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity));

// FORCE SIMULATION
const nodes = philosophers.map(d => ({...d, x: W/2 + (d.century+500)*2.2, y: H/2}));
const nodeMap = new Map(nodes.map(n => [n.id, n]));

const edges = links.map(l => ({
  source: nodeMap.get(l.source) || l.source,
  target: nodeMap.get(l.target) || l.target,
  type: l.type
}));

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(edges).id(d => d.id).distance(120).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("x", d3.forceX(d => W*0.15 + ((d.century+500)/2400)*W*0.7).strength(0.15))
  .force("collision", d3.forceCollide().radius(25));

// DRAW
const link = g.append("g").selectAll("line")
  .data(edges).join("line")
  .attr("class", "link")
  .attr("stroke-dasharray", d => d.type==="critique"?"4,3":null)
  .attr("stroke", d => d.type==="critique"?"#ff6b6b":null);

const node = g.append("g").selectAll("g")
  .data(nodes).join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

const nodeRadius = d => 6 + Math.min(d.name.length*0.3, 10);

node.append("circle")
  .attr("r", d => nodeRadius(d))
  .attr("fill", d => schoolColors[d.school])
  .attr("stroke", "#fff")
  .attr("stroke-width", 1)
  .attr("opacity", 0.85);

// ===== HTML LABELS (absolutely positioned divs, bypass SVG text issues) =====
const labelsContainer = d3.select("#main").append("div")
  .attr("id", "labels-layer")
  .style("position", "absolute")
  .style("top", "0")
  .style("left", "0")
  .style("width", "100%")
  .style("height", "100%")
  .style("pointer-events", "none")
  .style("z-index", "5");

const labels = labelsContainer.selectAll("div")
  .data(nodes).join("div")
  .attr("class", "node-label")
  .text(d => d.name.split(" ")[0]);

document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").classList.remove("show");
});

  if (e.target === document.getElementById("modal-overlay"))
    document.getElementById("modal-overlay").classList.remove("show");
});

// ========== SEARCH & FILTER ==========
function updateFilters() {
  const searchTerm = document.getElementById("search").value.toLowerCase();
  const schoolFilter = document.getElementById("school-select").value;

  node.each(function(d) {
    const nameMatch = d.name.toLowerCase().includes(searchTerm);
    const schoolMatch = schoolFilter==="all" || d.school===schoolFilter;
    d3.select(this).classed("dimmed", !nameMatch || !schoolMatch);
  });
  labels.each(function(d) {
    const nameMatch = d.name.toLowerCase().includes(searchTerm);
    const schoolMatch = schoolFilter==="all" || d.school===schoolFilter;
    d3.select(this).classed("dimmed", !nameMatch || !schoolMatch);
  });
  link.each(function(d) {
    const s = typeof d.source==="object"?d.source:d.source;
    const t = typeof d.target==="object"?d.target:d.target;
    const searchTerm = document.getElementById("search").value.toLowerCase();
    const schoolFilter = document.getElementById("school-select").value;
    const sOk = s.name&&s.name.toLowerCase().includes(searchTerm) && (schoolFilter==="all"||s.school===schoolFilter);
    const tOk = t.name&&t.name.toLowerCase().includes(searchTerm) && (schoolFilter==="all"||t.school===schoolFilter);
    d3.select(this).classed("dimmed", !sOk||!tOk);
  });
  document.getElementById("node-count").textContent =
    nodes.filter(n => { return !d3.select(node.nodes()[nodes.indexOf(n)]).classed("dimmed"); }).length;
}

document.getElementById("search").addEventListener("input", updateFilters);
document.getElementById("school-select").addEventListener("change", updateFilters);

// Timeline slider
const yearMin = document.getElementById("year-min");
const yearLabel = document.getElementById("year-label");
yearMin.addEventListener("input", () => {
  const minYear = +yearMin.value;
  yearLabel.textContent = `${Math.abs(minYear)} ${minYear<0?'BC':'AD'} — 1950 AD`;
  node.each(function(d) { d3.select(this).classed("dimmed", d.century < minYear); });
  labels.each(function(d) { d3.select(this).classed("dimmed", d.century < minYear); });
  link.each(function(d) {
    const s = typeof d.source==="object"?d.source:d.source;
    const t = typeof d.target==="object"?d.target:d.target;
    d3.select(this).classed("dimmed", s&&s.century<minYear || t&&t.century<minYear);
  });
});

// ========== SIMULATION TICK ==========
simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);

  // Position HTML labels over SVG nodes
  labels.style("left", function(d) {
    return (d.x * currentTransform.k + currentTransform.x) + "px";
  }).style("top", function(d) {
    return (d.y * currentTransform.k + currentTransform.y) + "px";
  });
});

// ========== LEGEND ==========
const legend = d3.select("#legend");
legend.html(Object.entries(schoolNames).map(([k,v]) =>
  `<div><span class="dot" style="background:${schoolColors[k]}"></span>${v}</div>`
).join(""));

// ========== KEYBOARD ==========
document.addEventListener("keydown", e => {
  if (e.key==="Escape") document.getElementById("modal-overlay").classList.remove("show");
});

// Set initial label positions after a short delay (once layout stabilizes)
setTimeout(() => {
  labels.style("left", function(d) { return d.x + "px"; })
       .style("top", function(d) { return d.y + "px"; });
}, 2000);
</script>
</body>
</html>
